<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Lumen/lumen.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen</title>
    <script>
        // Redirect to the base URL so React Router can handle the route
        (function () {
            var path = window.location.pathname;
            if (!path.startsWith('/Lumen')) {
                path = '/Lumen' + path;
            }
            window.location.replace(path);
        })();
    </script>
</head>

<body>
    <div id="root">Loading...</div>
</body>

</html>
